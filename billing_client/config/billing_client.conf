# Windows Billing Client Configuration File
# Generated automatically - modify with care

[global]
data_collection_interval = 3600
log_level = INFO
max_retry_attempts = 3
output_directory = output

[domain:ds-vm1.local]
domain_controller = 192.168.1.55
service_account = ds-vm2
connection_timeout = 30
use_ssl = false
data_sources = WMI, EventLog, Registry

# LDAP Authentication Settings
[ldap]
# LDAP server (usually same as domain controller)
# Real domain controller IP address
ldap_server = 192.168.1.55
# LDAP port (389 for standard, 636 for SSL/TLS)
ldap_port = 389
# Use SSL/TLS for LDAP connection (true/false)
ldap_use_ssl = false
# Base DN for user search (adjust according to your domain structure)
base_dn = DC=ds-vm1,DC=local
# User search filter (will be combined with username)
user_search_filter = (sAMAccountName=%s)
# Bind DN format for authentication (will be combined with username)
bind_dn_format = %s@ds-vm1.local
# Connection timeout in seconds
ldap_timeout = 10
